name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minisocial
          POSTGRES_PASSWORD: minisocial
          POSTGRES_DB: minisocial
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U minisocial"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://minisocial:minisocial@localhost:5433/minisocial?schema=public
      TEST_ADMIN_URL: postgresql://minisocial:minisocial@localhost:5433/postgres
      JWT_ACCESS_SECRET: ci-secret-that-is-definitely-long-enough-32chars

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      # Proves every import resolves and the app actually bundles.
      - run: npx expo export --platform android --output-dir /tmp/export

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      # gitleaks-action diffs from <commit>^, which does not exist for a root
      # commit: git errors, the action treats non-empty stderr as failure, and
      # it exits 1 having scanned zero bytes. Running the binary directly scans
      # the whole history instead, which is the point of having the job.
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"             | tar -xz gitleaks
          ./gitleaks version

      - name: Scan full git history
        run: ./gitleaks git . --redact --no-banner --exit-code 1

      - name: Scan working tree
        run: ./gitleaks dir . --redact --no-banner --exit-code 1
