services:
  db:
    image: postgres:16-alpine
    container_name: minisocial-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: minisocial
      POSTGRES_PASSWORD: minisocial
      POSTGRES_DB: minisocial
    ports:
      - "5433:5432"
    volumes:
      - minisocial-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minisocial -d minisocial"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  minisocial-data:
